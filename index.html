<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-body: #0b132b;
            --card-bg: #1c2541;
            --text-main: #ffffff;
            --text-sub: #cbd5e1;
            --border-color: #3a506b;
            --input-bg: #10172a;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            padding-bottom: 80px;
        }

        .card-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
        }

        .nav-tab-btn {
            background: var(--input-bg);
            color: var(--text-sub);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 18px;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-tab-btn.active {
            background: var(--accent-blue);
            color: #fff;
            border-color: var(--accent-blue);
        }

        .form-control {
            background-color: var(--input-bg) !important;
            color: #fff !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 10px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .bottom-nav a {
            color: var(--text-sub);
            text-decoration: none;
            font-size: 12px;
            text-align: center;
        }

        .bottom-nav a.active { color: var(--accent-blue); }

        .feed-item {
            background: var(--input-bg);
            border-left: 4px solid var(--accent-green);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<!-- Top Navbar -->
<div class="d-flex justify-content-between align-items-center p-3 card-box rounded-0 border-top-0 border-start-0 border-end-0">
    <h5 class="m-0 fw-bold text-primary"><i class="fa-solid fa-store me-2"></i>Mail Market</h5>
    <div class="badge bg-primary fs-6 px-3 py-2 rounded-pill" id="user-bal-display">৳ 0.00</div>
</div>

<div class="container mt-3" style="max-width: 600px;">

    <!-- Category Tabs -->
    <div class="d-flex gap-2 mb-3 overflow-auto pb-1" id="cat-tabs-container"></div>

    <!-- Product Cards View -->
    <div id="products-list-container" class="mb-4"></div>

    <!-- Live Deposit Feed (Last 1 Hour) -->
    <div class="card-box p-3 mb-3">
        <h6 class="fw-bold text-success mb-3"><i class="fa-solid fa-wallet me-2"></i>Live Deposits (Last 1 Hour)</h6>
        <div id="live-deposit-feed"></div>
    </div>

    <!-- Live Purchase Feed (Last 1 Hour) -->
    <div class="card-box p-3 mb-4">
        <h6 class="fw-bold text-info mb-3"><i class="fa-solid fa-cart-shopping me-2"></i>Live Purchases (Last 1 Hour)</h6>
        <div id="live-purchase-feed"></div>
    </div>

</div>

<!-- Purchase Modal with Quantity & Copy All -->
<div class="modal fade" id="buyModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content card-box text-white">
            <div class="modal-header border-secondary">
                <h5 class="modal-title fw-bold" id="modal-product-title">Buy Product</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modal-body-content">
                <!-- Dynamic Content -->
            </div>
        </div>
    </div>
</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
    <a href="#" class="active"><i class="fa-solid fa-house d-block fs-5"></i>Home</a>
    <a href="deposit.html"><i class="fa-solid fa-wallet d-block fs-5"></i>Deposit</a>
    <a href="history.html"><i class="fa-solid fa-clock-rotate-left d-block fs-5"></i>History</a>
    <a href="#" onclick="logout()"><i class="fa-solid fa-power-off d-block fs-5"></i>Logout</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let activeCat = '';
    let selectedCat = '';
    let selectedTitle = '';

    function getCurrentUser() {
        return sessionStorage.getItem('logged_user') || 'demo_user@gmail.com';
    }

    function maskEmail(email) {
        if(!email || !email.includes('@')) return 'user***@gmail.com';
        let parts = email.split('@');
        let name = parts[0];
        let masked = name.length > 3 ? name.substring(0, 2) + '*******' + name.slice(-2) : name + '***';
        return masked + '@' + parts[1];
    }

    function initApp() {
        let store = JSON.parse(localStorage.getItem('app_store_data')) || {};
        let users = JSON.parse(localStorage.getItem('app_users')) || [];
        let currEmail = getCurrentUser();
        let u = users.find(x => x.email === currEmail);

        // Update Balance
        document.getElementById('user-bal-display').innerText = `৳ ${Number(u ? u.balance : 0).toFixed(2)}`;

        // Render Tabs
        let cats = Object.keys(store);
        let tabsHtml = '';
        if(cats.length > 0) {
            if(!activeCat) activeCat = cats[0];
            cats.forEach(c => {
                tabsHtml += `<button class="nav-tab-btn ${c === activeCat ? 'active' : ''}" onclick="switchCategory('${c}')">${c}</button>`;
            });
        }
        document.getElementById('cat-tabs-container').innerHTML = tabsHtml;

        // Render Products
        renderProducts();

        // Render Real Live Feeds
        renderLiveFeeds();
    }

    function switchCategory(cat) {
        activeCat = cat;
        initApp();
    }

    function renderProducts() {
        let store = JSON.parse(localStorage.getItem('app_store_data')) || {};
        let container = document.getElementById('products-list-container');
        container.innerHTML = '';

        if(!activeCat || !store[activeCat]) {
            container.innerHTML = '<div class="text-center text-sub py-4">No products available.</div>';
            return;
        }

        store[activeCat].forEach(item => {
            let stockCount = item.mails ? item.mails.length : 0;
            let isOut = stockCount <= 0;

            container.innerHTML += `
                <div class="card-box p-3 mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="fw-bold m-0">${item.title}</h6>
                        <span class="badge ${isOut ? 'bg-danger' : 'bg-success'}">${isOut ? 'OUT OF STOCK' : 'IN STOCK'}</span>
                    </div>
                    <div class="fs-5 fw-bold text-primary mb-2">৳ ${Number(item.price).toFixed(2)}</div>
                    <div class="small text-sub mb-3"><i class="fa-solid fa-box me-1"></i>Available: <strong>${stockCount}</strong></div>
                    <button onclick="openBuyModal('${activeCat}', '${item.title}')" class="btn ${isOut ? 'btn-secondary' : 'btn-primary'} w-100 fw-bold" ${isOut ? 'disabled' : ''}>
                        ${isOut ? 'Out of Stock' : 'Buy Now'}
                    </button>
                </div>`;
        });
    }

    function openBuyModal(cat, title) {
        selectedCat = cat;
        selectedTitle = title;
        let store = JSON.parse(localStorage.getItem('app_store_data')) || {};
        let item = store[cat].find(i => i.title === title);

        document.getElementById('modal-product-title').innerText = item.title;
        let stockCount = item.mails ? item.mails.length : 0;

        document.getElementById('modal-body-content').innerHTML = `
            <div class="mb-3">
                <label class="small text-sub mb-1">Price Per Unit</label>
                <div class="fw-bold text-warning">৳ ${Number(item.price).toFixed(2)}</div>
            </div>
            <div class="mb-3">
                <label class="small text-sub mb-1">Enter Quantity (Max ${stockCount})</label>
                <input type="number" id="buy-qty-input" class="form-control" value="1" min="1" max="${stockCount}" onchange="updateTotalPrice(${item.price})">
            </div>
            <div class="mb-3">
                <label class="small text-sub mb-1">Total Cost</label>
                <div class="fs-5 fw-bold text-success" id="total-price-disp">৳ ${Number(item.price).toFixed(2)}</div>
            </div>
            <button onclick="confirmPurchase()" class="btn btn-success w-100 fw-bold py-2">Confirm Purchase</button>`;

        let modal = new bootstrap.Modal(document.getElementById('buyModal'));
        modal.show();
    }

    function updateTotalPrice(price) {
        let qty = Number(document.getElementById('buy-qty-input').value) || 1;
        document.getElementById('total-price-disp').innerText = `৳ ${(price * qty).toFixed(2)}`;
    }

    function confirmPurchase() {
        let qty = Number(document.getElementById('buy-qty-input').value);
        if(!qty || qty < 1) return alert('Invalid Quantity!');

        let store = JSON.parse(localStorage.getItem('app_store_data')) || {};
        let users = JSON.parse(localStorage.getItem('app_users')) || [];
        let currEmail = getCurrentUser();
        let uIdx = users.findIndex(u => u.email === currEmail);

        if(uIdx === -1) return alert('User not logged in!');

        let item = store[selectedCat].find(i => i.title === selectedTitle);
        if(!item || !item.mails || item.mails.length < qty) return alert('Not enough stock available!');

        let totalCost = item.price * qty;
        if(Number(users[uIdx].balance || 0) < totalCost) return alert('Insufficient Balance! Please Deposit.');

        // Deduct Balance & Stock
        users[uIdx].balance -= totalCost;
        let purchasedMails = item.mails.splice(0, qty);

        // Add to User Purchase History
        if(!users[uIdx].history) users[uIdx].history = [];
        users[uIdx].history.push({
            type: 'purchase',
            title: item.title,
            qty: qty,
            cost: totalCost,
            data: purchasedMails,
            time: new Date().toLocaleTimeString()
        });

        // Add to Global Live Purchases (1 Hour Sync)
        let livePurchases = JSON.parse(localStorage.getItem('app_live_purchases')) || [];
        livePurchases.unshift({
            user: currEmail,
            title: item.title,
            qty: qty,
            timestamp: Date.now()
        });
        localStorage.setItem('app_live_purchases', JSON.stringify(livePurchases));

        // Save State
        localStorage.setItem('app_store_data', JSON.stringify(store));
        localStorage.setItem('app_users', JSON.stringify(users));

        // Show Delivery View in Modal
        showDeliveryModal(purchasedMails);
        initApp();
    }

    function showDeliveryModal(mails) {
        let mailText = mails.join('\n');
        let html = `
            <div class="text-center text-success mb-3"><i class="fa-solid fa-circle-check fs-1"></i></div>
            <h6 class="text-center fw-bold text-white mb-3">Purchase Successful! (${mails.length} Items)</h6>
            <textarea id="delivered-mails-text" class="form-control mb-3" rows="5" readonly>${mailText}</textarea>
            <button onclick="copyAllMails()" class="btn btn-warning w-100 fw-bold py-2 mb-2">
                <i class="fa-solid fa-copy me-1"></i> Copy All
            </button>`;
        document.getElementById('modal-body-content').innerHTML = html;
    }

    function copyAllMails() {
        let copyText = document.getElementById("delivered-mails-text");
        copyText.select();
        navigator.clipboard.writeText(copyText.value);
        alert("All mails copied to clipboard!");
    }

    function renderLiveFeeds() {
        let now = Date.now();
        let oneHour = 60 * 60 * 1000;

        // 1. Live Deposits Filter (Last 1 hour real data)
        let deps = JSON.parse(localStorage.getItem('app_pending_deposits')) || [];
        let depContainer = document.getElementById('live-deposit-feed');
        depContainer.innerHTML = '';

        let recentDeps = deps.filter(d => (now - (d.timestamp || now)) < oneHour);

        if(!recentDeps.length) {
            depContainer.innerHTML = '<div class="text-sub small">No recent deposits in the last hour.</div>';
        } else {
            recentDeps.forEach(d => {
                depContainer.innerHTML += `
                    <div class="feed-item d-flex justify-content-between align-items-center">
                        <div>
                            <div class="fw-bold small text-white">${maskEmail(d.user)}</div>
                            <div class="text-sub small">${d.method || 'MFS Deposit'} - ৳${d.amount}</div>
                        </div>
                        <span class="badge bg-success">Success</span>
                    </div>`;
            });
        }

        // 2. Live Purchases Filter (Last 1 hour real data)
        let purchases = JSON.parse(localStorage.getItem('app_live_purchases')) || [];
        let purContainer = document.getElementById('live-purchase-feed');
        purContainer.innerHTML = '';

        let recentPurchases = purchases.filter(p => (now - p.timestamp) < oneHour);

        if(!recentPurchases.length) {
            purContainer.innerHTML = '<div class="text-sub small">No recent purchases in the last hour.</div>';
        } else {
            recentPurchases.forEach(p => {
                purContainer.innerHTML += `
                    <div class="feed-item d-flex justify-content-between align-items-center" style="border-left-color: var(--accent-blue);">
                        <div>
                            <div class="fw-bold small text-white">${maskEmail(p.user)}</div>
                            <div class="text-sub small">Bought <strong>${p.qty} pcs</strong> - ${p.title}</div>
                        </div>
                        <span class="badge bg-primary">Purchased</span>
                    </div>`;
            });
        }
    }

    function logout() {
        sessionStorage.clear();
        alert('Logged out!');
        location.reload();
    }

    initApp();
</script>
</body>
</html>
