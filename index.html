<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Market - Digital Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --accent-color: #6366f1; --text-color: #f8fafc; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: sans-serif; padding-bottom: 80px; }
        .top-navbar { background: #1e1b4b; border-bottom: 1px solid #312e81; padding: 15px 20px; }
        .product-card { background: var(--card-bg); border: 1px solid #334155; border-radius: 16px; margin-bottom: 15px; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #1e1b4b; border-top: 1px solid #312e81; display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .bottom-nav a { color: #94a3b8; text-decoration: none; text-align: center; font-size: 11px; }
        .bottom-nav a.active { color: #818cf8; }
        .balance-badge { background: #312e81; color: #a5b4fc; border: 1px solid #6366f1; border-radius: 20px; padding: 6px 14px; font-weight: 600; }
        .btn-custom { background: var(--accent-color); color: white; border-radius: 10px; font-weight: 600; }
        .form-control, .form-select { background-color: #0f172a; border: 1px solid #334155; color: white; border-radius: 10px; }
    </style>
</head>
<body>

<div class="top-navbar d-flex justify-content-between align-items-center shadow-sm">
    <h5 class="m-0 fw-bold text-white"><i class="fa-solid fa-cart-flatbed-suitcases me-2 text-primary"></i>Mail Market</h5>
    <div><span class="balance-badge">৳ <span id="balance-val">0.00</span></span></div>
</div>

<div class="container mt-3">
    <!-- Auth View -->
    <div id="auth-view" class="card product-card p-4 mx-auto my-5" style="max-width: 400px;">
        <h4 class="text-center text-white fw-bold mb-3" id="auth-title">Welcome to Mail Market</h4>
        <div class="mb-3">
            <label class="form-label text-muted small">Email Address</label>
            <input type="email" id="user-email" class="form-control" placeholder="Enter email">
        </div>
        <div class="mb-3">
            <label class="form-label text-muted small">Password</label>
            <input type="password" id="user-password" class="form-control" placeholder="Enter password">
        </div>
        <button onclick="handleAuth()" class="btn btn-custom w-100 py-2 mb-2" id="auth-btn">Login / Register</button>
    </div>

    <!-- Dashboard View -->
    <div id="dashboard-view" class="d-none">
        <div class="alert alert-info text-center" style="background: #1e293b; border-color: #334155; color: #818cf8;">
            Account logged in successfully! Market items will appear here once added from Admin panel.
        </div>
    </div>
</div>

<div class="bottom-nav">
    <a href="#" class="active"><i class="fa-solid fa-house-chimney d-block fs-6 mb-1"></i>Home</a>
    <a href="#" onclick="alert('Account required')"><i class="fa-solid fa-wallet d-block fs-6 mb-1"></i>Deposit</a>
    <a href="#" onclick="location.reload()"><i class="fa-solid fa-power-off d-block fs-6 mb-1"></i>Logout</a>
</div>

<script>
    function handleAuth() {
        const email = document.getElementById('user-email').value.trim();
        const password = document.getElementById('user-password').value.trim();

        if(!email || !password) {
            alert('Please fill in both email and password');
            return;
        }

        // Save session locally to bypass DB errors
        localStorage.setItem('user_email', email);
        document.getElementById('auth-view').classList.add('d-none');
        document.getElementById('dashboard-view').classList.remove('d-none');
    }

    // Auto Login check
    if(localStorage.getItem('user_email')) {
        document.getElementById('auth-view').classList.add('d-none');
        document.getElementById('dashboard-view').classList.remove('d-none');
    }
</script>
</body>
</html>
