<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Market - Digital Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #0b132b;
            --card-bg: #1c2541;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --border-color: #3a506b;
            --input-bg: #10172a;
            --accent-color: #3b82f6;
        }

        [data-theme="light"] {
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #f1f5f9;
            --accent-color: #2563eb;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            padding-bottom: 90px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .top-navbar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
        }

        .theme-btn {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .card-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .form-control, .form-select {
            background-color: var(--input-bg) !important;
            color: var(--text-main) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 10px;
            padding: 10px 14px;
        }

        .form-control::placeholder { color: var(--text-sub) !important; }

        .cat-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
            padding: 5px 0 10px 0;
        }

        .cat-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cat-btn.active {
            background: #3b82f6;
            color: #ffffff;
            border-color: #60a5fa;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.8);
            transform: scale(1.03);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .bottom-nav a {
            color: var(--text-sub);
            text-decoration: none;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
        }

        .bottom-nav a.active { color: var(--accent-color); font-weight: 600; }

        .live-card {
            background: var(--input-bg);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 8px;
            border-left: 4px solid #10b981;
            font-size: 13px;
        }
    </style>
</head>
<body>

<!-- Header Top Bar -->
<div class="top-navbar d-flex justify-content-between align-items-center">
    <h5 class="m-0 fw-bold text-primary"><i class="fa-solid fa-store me-2"></i>Mail Market</h5>
    <div class="d-flex align-items-center gap-2">
        <span class="badge bg-primary px-3 py-2 rounded-pill fs-6">৳ <span id="user-bal">0.00</span></span>
        <button onclick="toggleTheme()" class="theme-btn" id="theme-icon"><i class="fa-solid fa-moon"></i></button>
    </div>
</div>

<div class="container mt-4" style="max-width: 550px;">

    <!-- Auth Box -->
    <div id="auth-box" class="card-box p-4 mx-auto my-3">
        <h4 class="fw-bold mb-3 text-center" id="auth-title">Account Login</h4>
        
        <div class="mb-3" id="name-field" style="display: none;">
            <label class="small text-sub mb-1">Full Name</label>
            <input type="text" id="reg-name" class="form-control" placeholder="Enter full name">
        </div>

        <div class="mb-3">
            <label class="small text-sub mb-1">Email Address</label>
            <input type="email" id="reg-email" class="form-control" placeholder="Enter email address">
        </div>

        <div class="mb-3">
            <label class="small text-sub mb-1">Password</label>
            <input type="password" id="reg-pass" class="form-control" placeholder="Enter password">
        </div>

        <button onclick="handleAuth()" class="btn btn-primary w-100 fw-bold py-2 mb-3" id="auth-btn">Login</button>

        <p class="text-center small mb-0">
            <a href="javascript:void(0)" onclick="switchAuthMode()" id="auth-toggle-link" class="text-primary text-decoration-none fw-semibold">Don't have an account? Register here</a>
        </p>
    </div>

    <!-- Main Dashboard View -->
    <div id="dashboard-view" class="d-none page-section">
        <div class="cat-scroll mb-3" id="cat-tabs">
            <!-- Dynamic Category Buttons -->
        </div>

        <!-- Product Display List -->
        <div id="product-container">
            <!-- Dynamic Items -->
        </div>

        <!-- Live Activities -->
        <div class="card-box p-3 mb-3">
            <h6 class="fw-bold mb-3 text-success"><i class="fa-solid fa-wallet me-2"></i>Live Deposits (Last 1 Hour)</h6>
            <div id="deposit-list"></div>
        </div>

        <div class="card-box p-3 mb-3">
            <h6 class="fw-bold mb-3 text-primary"><i class="fa-solid fa-cart-shopping me-2"></i>Live Purchases (Last 1 Hour)</h6>
            <div id="purchase-list"></div>
        </div>
    </div>

    <!-- Deposit Page View -->
    <div id="deposit-view" class="d-none page-section">
        <div class="card-box p-4">
            <h5 class="fw-bold mb-3 text-primary"><i class="fa-solid fa-wallet me-2"></i>Add Balance (Deposit)</h5>
            <div class="alert alert-info py-2 small" style="background:#1e293b; color:#38bdf8; border-color:#0284c7;">
                সেন্ড মানি করে TrxID সাবমিট করুন:
                <div class="fw-bold text-warning mt-1" id="payment-numbers-display">
                    <!-- Dynamic Numbers -->
                </div>
            </div>

            <div class="mb-3">
                <label class="small text-sub mb-1">Payment Method</label>
                <select id="dep-method" class="form-select">
                    <option value="bKash">bKash Personal</option>
                    <option value="Nagad">Nagad Personal</option>
                    <option value="Rocket">Rocket Personal</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="small text-sub mb-1">Amount (৳ BDT)</label>
                <input type="number" id="dep-amount" class="form-control" placeholder="e.g. 500">
            </div>

            <div class="mb-3">
                <label class="small text-sub mb-1">Transaction ID (TrxID)</label>
                <input type="text" id="dep-trx" class="form-control" placeholder="e.g. 9N74K2L8">
            </div>

            <button onclick="submitDeposit()" class="btn btn-success w-100 fw-bold py-2">Submit Request</button>
        </div>
    </div>

    <!-- Purchase History View -->
    <div id="history-view" class="d-none page-section">
        <div class="card-box p-4">
            <h5 class="fw-bold mb-3 text-primary"><i class="fa-solid fa-clock-history me-2"></i>Purchase History</h5>
            <div id="my-orders" class="small">
                <div class="text-center text-muted py-3">এখনো কোনো কেনাকাটা করা হয়নি।</div>
            </div>
        </div>
    </div>

</div>

<!-- Bottom Nav -->
<div class="bottom-nav d-none" id="nav-bar">
    <a onclick="switchPage('dashboard')" id="nav-home" class="active"><i class="fa-solid fa-house d-block fs-6 mb-1"></i>Home</a>
    <a onclick="switchPage('deposit')" id="nav-deposit"><i class="fa-solid fa-wallet d-block fs-6 mb-1"></i>Deposit</a>
    <a onclick="switchPage('history')" id="nav-history"><i class="fa-solid fa-clock-history d-block fs-6 mb-1"></i>History</a>
    <a onclick="logout()"><i class="fa-solid fa-power-off d-block fs-6 mb-1"></i>Logout</a>
</div>

<script>
    let isLogin = true;
    let currentUser = null;

    function toggleTheme() {
        const body = document.body;
        const icon = document.getElementById('theme-icon');
        if (body.getAttribute('data-theme') === 'light') {
            body.removeAttribute('data-theme');
            icon.innerHTML = '<i class="fa-solid fa-moon"></i>';
        } else {
            body.setAttribute('data-theme', 'light');
            icon.innerHTML = '<i class="fa-solid fa-sun text-warning"></i>';
        }
    }

    function switchPage(page) {
        document.querySelectorAll('.page-section').forEach(sec => sec.classList.add('d-none'));
        document.querySelectorAll('.bottom-nav a').forEach(a => a.classList.remove('active'));

        if(page === 'dashboard') {
            document.getElementById('dashboard-view').classList.remove('d-none');
            document.getElementById('nav-home').classList.add('active');
            loadProducts();
        } else if(page === 'deposit') {
            document.getElementById('deposit-view').classList.remove('d-none');
            document.getElementById('nav-deposit').classList.add('active');
            loadPaymentNumbers();
        } else if(page === 'history') {
            document.getElementById('history-view').classList.remove('d-none');
            document.getElementById('nav-history').classList.add('active');
        }
    }

    function switchAuthMode() {
        isLogin = !isLogin;
        document.getElementById('auth-title').innerText = isLogin ? "Account Login" : "Create Account";
        document.getElementById('name-field').style.display = isLogin ? "none" : "block";
        document.getElementById('auth-btn').innerText = isLogin ? "Login" : "Register";
        document.getElementById('auth-toggle-link').innerText = isLogin ? "Don't have an account? Register here" : "Already have an account? Login here";
    }

    function handleAuth() {
        const email = document.getElementById('reg-email').value.trim();
        const pass = document.getElementById('reg-pass').value.trim();
        if(!email || !pass) return alert('Please fill in required fields!');

        let users = JSON.parse(localStorage.getItem('app_users')) || [];
        
        if(!isLogin) {
            if(users.find(u => u.email === email)) return alert('একাউন্ট তৈরি করা আছে! লগইন করুন।');
            let newUser = { email: email, pass: pass, balance: 0.00 };
            users.push(newUser);
            localStorage.setItem('app_users', JSON.stringify(users));
            currentUser = newUser;
        } else {
            let found = users.find(u => u.email === email && u.pass === pass);
            if(!found) return alert('ইমেইল বা পাসওয়ার্ড ভুল!');
            currentUser = found;
        }

        localStorage.setItem('user_logged', email);
        showDashboard();
    }

    function showDashboard() {
        let email = localStorage.getItem('user_logged');
        let users = JSON.parse(localStorage.getItem('app_users')) || [];
        currentUser = users.find(u => u.email === email) || { email: email, balance: 0.00 };

        document.getElementById('user-bal').innerText = Number(currentUser.balance).toFixed(2);
        document.getElementById('auth-box').classList.add('d-none');
        document.getElementById('dashboard-view').classList.remove('d-none');
        document.getElementById('nav-bar').classList.remove('d-none');
        loadProducts();
    }

    function logout() {
        localStorage.removeItem('user_logged');
        location.reload();
    }

    function loadPaymentNumbers() {
        let nums = JSON.parse(localStorage.getItem('app_pay_numbers')) || { bkash: '01700000000', nagad: '01700000000', rocket: '01700000000' };
        document.getElementById('payment-numbers-display').innerHTML = `
            bKash: ${nums.bkash} <br>
            Nagad: ${nums.nagad} <br>
            Rocket: ${nums.rocket}
        `;
    }

    function submitDeposit() {
        const amt = document.getElementById('dep-amount').value;
        const trx = document.getElementById('dep-trx').value;
        const method = document.getElementById('dep-method').value;

        if(!amt || !trx) return alert('পরিমাণ এবং TrxID সঠিকভাবে দিন!');

        let deps = JSON.parse(localStorage.getItem('app_pending_deposits')) || [];
        deps.push({
            user: currentUser.email,
            amount: amt,
            trx: trx,
            method: method,
            time: new Date().toLocaleTimeString()
        });
        localStorage.setItem('app_pending_deposits', JSON.stringify(deps));

        alert('ডিপোজিট রিকোয়েস্ট জমা হয়েছে! অ্যাডমিন ভেরিফাই করবেন।');
        document.getElementById('dep-amount').value = '';
        document.getElementById('dep-trx').value = '';
        switchPage('dashboard');
    }

    function loadProducts() {
        let store = JSON.parse(localStorage.getItem('app_store_data')) || {};
        let catTabs = document.getElementById('cat-tabs');
        let container = document.getElementById('product-container');

        catTabs.innerHTML = '';
        container.innerHTML = '';

        let categories = Object.keys(store);
        if(!categories.length) {
            container.innerHTML = '<div class="text-center text-muted py-4">কোনো প্রোডাক্ট পাবলিশ করা হয়নি।</div>';
            return;
        }

        categories.forEach((cat, index) => {
            catTabs.innerHTML += `<button class="cat-btn ${index===0?'active':''}" onclick="filterCat('${cat}', this)">${cat}</button>`;
        });

        renderCatItems(categories[0]);
    }

    function filterCat(cat, btn) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderCatItems(cat);
    }

    function renderCatItems(cat) {
        let store = JSON.parse(localStorage.getItem('app_store_data')) || {};
        let container = document.getElementById('product-container');
        container.innerHTML = '';

        if(store[cat]) {
            store[cat].forEach(item => {
                let stockCount = item.mails ? item.mails.length : 0;
                container.innerHTML += `
                    <div class="card-box p-3 mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="fw-bold m-0">${item.title}</h6>
                            <span class="badge bg-success">ACTIVE</span>
                        </div>
                        <h4 class="fw-bold text-primary mb-2">৳${item.price}</h4>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="small fw-semibold text-success"><i class="fa-solid fa-box me-1"></i>Stock: <span>${stockCount}</span></span>
                            <button class="btn btn-primary fw-bold px-4" onclick="buyItem('${cat}', '${item.title}')">Buy Now</button>
                        </div>
                    </div>`;
            });
        }
    }

    function buyItem(cat, title) {
        let store = JSON.parse(localStorage.getItem('app_store_data')) || {};
        let item = store[cat].find(i => i.title === title);

        if(!item || !item.mails || !item.mails.length) return alert('এই প্রোডাক্টটির স্টক খালি আছে!');
        if(Number(currentUser.balance) < Number(item.price)) return alert('আপনার পর্যাপ্ত ব্যালেন্স নেই! ডিপোজিট করুন।');

        // Deduct Balance & Give Stock
        currentUser.balance = Number(currentUser.balance) - Number(item.price);
        let mailData = item.mails.shift(); // Remove 1 mail from stock
        
        // Update DB
        localStorage.setItem('app_store_data', JSON.stringify(store));
        let users = JSON.parse(localStorage.getItem('app_users')) || [];
        let uIdx = users.findIndex(u => u.email === currentUser.email);
        if(uIdx !== -1) users[uIdx].balance = currentUser.balance;
        localStorage.setItem('app_users', JSON.stringify(users));

        alert(`ক্রয় সফল হয়েছে!\nঅ্যাকাউন্ট ডাটা: ${mailData}`);
        showDashboard();
    }

    // Live Activity Simulation
    const randomUsers = ['tanvir99@gmail.com', 'shakil_bd@yahoo.com', 'rakib_h@gmail.com', 'fahim_22@outlook.com'];
    function getActivities(k) {
        let d = JSON.parse(localStorage.getItem(k)) || [];
        let now = new Date().getTime();
        return d.filter(i => now - i.time < 3600000);
    }
    function renderActivities() {
        let depList = document.getElementById('deposit-list');
        let purList = document.getElementById('purchase-list');
        let deps = getActivities('live_deposits');
        let purs = getActivities('live_purchases');

        depList.innerHTML = deps.length ? deps.map(d => `<div class="live-card d-flex justify-content-between align-items-center"><div><div class="fw-bold">${d.user}</div><div class="text-sub">${d.text}</div></div><span class="badge bg-success">Success</span></div>`).join('') : '<div class="text-muted small text-center">No deposits in last 1 hour.</div>';
        purList.innerHTML = purs.length ? purs.map(p => `<div class="live-card d-flex justify-content-between align-items-center" style="border-left-color: #3b82f6;"><div><div class="fw-bold">${p.user}</div><div class="text-sub">${p.text}</div></div><span class="badge bg-primary">Completed</span></div>`).join('') : '<div class="text-muted small text-center">No purchases in last 1 hour.</div>';
    }

    if(localStorage.getItem('user_logged')) showDashboard();
    renderActivities();
</script>
</body>
</html>
