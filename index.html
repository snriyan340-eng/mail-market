<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Market - Digital Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #0b132b;
            --card-bg: #1c2541;
            --text-main: #ffffff;
            --text-sub: #cbd5e1;
            --border-color: #3a506b;
            --input-bg: #10172a;
            --accent-color: #3b82f6;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            padding-bottom: 90px;
        }

        .top-navbar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
        }

        .card-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .form-control, .form-select {
            background-color: var(--input-bg) !important;
            color: #ffffff !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 10px;
            padding: 10px 14px;
        }

        .form-control::placeholder { color: #94a3b8 !important; }

        .cat-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
            padding: 5px 0 10px 0;
        }

        .cat-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cat-btn.active {
            background: #3b82f6;
            color: #ffffff;
            border-color: #60a5fa;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.8);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .bottom-nav a {
            color: var(--text-sub);
            text-decoration: none;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
        }

        .bottom-nav a.active { color: var(--accent-color); font-weight: 600; }

        /* MFS Payment Option Styles */
        .mfs-card {
            border: 2px solid var(--border-color);
            background: var(--input-bg);
            border-radius: 12px;
            padding: 12px 5px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .mfs-card.selected {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.15);
        }

        .mfs-logo-icon {
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 15px;
            border-radius: 6px;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .bkash-bg { background: #e2136e; color: #fff; }
        .nagad-bg { background: #f7921e; color: #fff; }
        .rocket-bg { background: #8c3494; color: #fff; }

        .live-card {
            background: var(--input-bg);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 8px;
            border-left: 4px solid #10b981;
            font-size: 13px;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<!-- Header -->
<div class="top-navbar d-flex justify-content-between align-items-center">
    <h5 class="m-0 fw-bold text-primary"><i class="fa-solid fa-store me-2"></i>Mail Market</h5>
    <div class="d-flex align-items-center gap-2">
        <span class="badge bg-primary px-3 py-2 rounded-pill fs-6">৳ <span id="user-bal">0.00</span></span>
    </div>
</div>

<div class="container mt-4" style="max-width: 550px;">

    <!-- Auth Form -->
    <div id="auth-box" class="card-box p-4 mx-auto my-3">
        <h4 class="fw-bold mb-3 text-center" id="auth-title">Account Login</h4>

        <div class="mb-3">
            <label class="small text-sub mb-1">Gmail / Email Address</label>
            <input type="email" id="reg-email" class="form-control" placeholder="example@gmail.com">
        </div>

        <div class="mb-3">
            <label class="small text-sub mb-1">Password</label>
            <input type="password" id="reg-pass" class="form-control" placeholder="Enter password">
        </div>

        <button onclick="handleAuth()" class="btn btn-primary w-100 fw-bold py-2 mb-3" id="auth-btn">Login</button>

        <p class="text-center small mb-0">
            <a href="javascript:void(0)" onclick="switchAuthMode()" id="auth-toggle-link" class="text-primary text-decoration-none fw-semibold">Don't have an account? Register here</a>
        </p>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard-view" class="d-none page-section">
        <div class="cat-scroll mb-3" id="cat-tabs"></div>

        <!-- Product List -->
        <div id="product-container"></div>

        <!-- Live Activities -->
        <div class="card-box p-3 mb-3">
            <h6 class="fw-bold mb-3 text-success"><i class="fa-solid fa-wallet me-2"></i>Live Deposits (Last 1 Hour)</h6>
            <div id="deposit-list"></div>
        </div>

        <div class="card-box p-3 mb-3">
            <h6 class="fw-bold mb-3 text-primary"><i class="fa-solid fa-cart-shopping me-2"></i>Live Purchases (Last 1 Hour)</h6>
            <div id="purchase-list"></div>
        </div>
    </div>

    <!-- Deposit View -->
    <div id="deposit-view" class="d-none page-section">
        <div class="card-box p-4">
            
            <div class="alert alert-primary py-2 px-3 mb-3 d-flex align-items-center justify-content-between" style="background: rgba(59, 130, 246, 0.15); border-color: #3b82f6; color: #60a5fa;">
                <span class="fw-bold small"><i class="fa-solid fa-circle-info me-2"></i>MINIMUM DEPOSIT</span>
                <span class="badge bg-primary fs-6">৳ 25</span>
            </div>

            <div class="mb-3">
                <label class="small text-sub mb-1">Amount (BDT)</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-white fw-bold">৳</span>
                    <input type="number" id="dep-amount" class="form-control" placeholder="0.00" min="25" oninput="updatePayBtnAmount()">
                </div>
            </div>

            <label class="small text-sub mb-2">Payment Method</label>
            <div class="row g-2 mb-3">
                <div class="col-4">
                    <div class="mfs-card selected" id="mfs-bkash" onclick="selectMFS('bKash')">
                        <div class="mfs-logo-icon bkash-bg">bKash</div>
                        <span class="small fw-semibold d-block">bKash Personal</span>
                    </div>
                </div>
                <div class="col-4">
                    <div class="mfs-card" id="mfs-nagad" onclick="selectMFS('Nagad')">
                        <div class="mfs-logo-icon nagad-bg">Nagad</div>
                        <span class="small fw-semibold d-block">Nagad</span>
                    </div>
                </div>
                <div class="col-4">
                    <div class="mfs-card" id="mfs-rocket" onclick="selectMFS('Rocket')">
                        <div class="mfs-logo-icon rocket-bg">Rocket</div>
                        <span class="small fw-semibold d-block">Rocket</span>
                    </div>
                </div>
            </div>

            <div class="alert alert-warning p-3 mb-3" style="background: rgba(245, 158, 11, 0.15); border-color: #f59e0b; color: #fbbf24;">
                <div class="small fw-bold mb-1">Send Money Personal Number:</div>
                <h5 class="fw-bold m-0 text-white" id="selected-mfs-number">01700000000</h5>
            </div>

            <div class="mb-3">
                <label class="small text-sub mb-1">Transaction ID (TrxID)</label>
                <input type="text" id="dep-trx" class="form-control" placeholder="e.g. 9N74K2L8">
            </div>

            <button onclick="submitDeposit()" class="btn btn-success w-100 fw-bold py-2" id="submit-pay-btn"><i class="fa-solid fa-lock me-2"></i>Pay ৳0.00 BDT</button>
        </div>
    </div>

    <!-- Purchase History -->
    <div id="history-view" class="d-none page-section">
        <div class="card-box p-4">
            <h5 class="fw-bold mb-3 text-primary"><i class="fa-solid fa-clock-rotate-left me-2"></i>Statement & History</h5>
            <div id="my-history-list" class="small"></div>
        </div>
    </div>

</div>

<!-- Bottom Nav -->
<div class="bottom-nav d-none" id="nav-bar">
    <a onclick="switchPage('dashboard')" id="nav-home" class="active"><i class="fa-solid fa-house d-block fs-6 mb-1"></i>Home</a>
    <a onclick="switchPage('deposit')" id="nav-deposit"><i class="fa-solid fa-wallet d-block fs-6 mb-1"></i>Deposit</a>
    <a onclick="switchPage('history')" id="nav-history"><i class="fa-solid fa-clock-rotate-left d-block fs-6 mb-1"></i>History</a>
    <a onclick="logout()"><i class="fa-solid fa-power-off d-block fs-6 mb-1"></i>Logout</a>
</div>

<script>
    let isLogin = true;
    let currentUser = null;
    let selectedMethod = 'bKash';

    // Mask Gmail function: snriyan340@gmail.com -> sn*******40@gmail.com
    function maskEmail(email) {
        if (!email || !email.includes('@')) return 'user@gmail.com';
        let parts = email.split('@');
        let name = parts[0];
        let domain = parts[1];

        if (name.length <= 4) {
            return name.substring(0, 1) + '***' + '@' + domain;
        }
        return name.substring(0, 2) + '*******' + name.substring(name.length - 2) + '@' + domain;
    }

    // Dynamic unique email generator (No duplication)
    let usedEmails = new Set();
    function generateUniqueGmail() {
        const prefixes = ['shakil', 'tanvir', 'arman', 'rakib', 'kamal', 'muna', 'hasan', 'rifat', 'sohel', 'jamal', 'sumon', 'faysal', 'nahid', 'sabbir', 'imran', 'nayan'];
        let newEmail = '';
        
        do {
            let name = prefixes[Math.floor(Math.random() * prefixes.length)];
            let num = Math.floor(100 + Math.random() * 900); // 3-digit random number
            newEmail = `${name}${num}@gmail.com`;
        } while (usedEmails.has(newEmail));

        usedEmails.add(newEmail);
        if (usedEmails.size > 100) usedEmails.clear(); // clear cache safely

        return newEmail;
    }

    function initDefaultStore() {
        if(!localStorage.getItem('app_store_data')) {
            let initialStore = {
                "Hotmail": [
                    { title: "Hotmail.com Fresh", price: 2.50, mails: ["usr1@hotmail.com|pass1", "usr2@hotmail.com|pass2", "usr3@hotmail.com|pass3"] },
                    { title: "Hotmail Premium 2024", price: 5.00, mails: ["usr4@hotmail.com|pass4", "usr5@hotmail.com|pass5"] }
                ],
                "Gmail": [
                    { title: "Gmail Aged (Old)", price: 12.00, mails: ["guser1@gmail.com|p123", "guser2@gmail.com|p456"] }
                ]
            };
            localStorage.setItem('app_store_data', JSON.stringify(initialStore));
        }
    }

    function switchPage(page) {
        document.querySelectorAll('.page-section').forEach(sec => sec.classList.add('d-none'));
        document.querySelectorAll('.bottom-nav a').forEach(a => a.classList.remove('active'));

        if(page === 'dashboard') {
            document.getElementById('dashboard-view').classList.remove('d-none');
            document.getElementById('nav-home').classList.add('active');
            loadProducts();
        } else if(page === 'deposit') {
            document.getElementById('deposit-view').classList.remove('d-none');
            document.getElementById('nav-deposit').classList.add('active');
            selectMFS(selectedMethod);
        } else if(page === 'history') {
            document.getElementById('history-view').classList.remove('d-none');
            document.getElementById('nav-history').classList.add('active');
            loadHistory();
        }
    }

    function switchAuthMode() {
        isLogin = !isLogin;
        document.getElementById('auth-title').innerText = isLogin ? "Account Login" : "Create Account";
        document.getElementById('auth-btn').innerText = isLogin ? "Login" : "Register";
        document.getElementById('auth-toggle-link').innerText = isLogin ? "Don't have an account? Register here" : "Already have an account? Login here";
    }

    function handleAuth() {
        const email = document.getElementById('reg-email').value.trim();
        const pass = document.getElementById('reg-pass').value.trim();
        if(!email || !pass) return alert('Please fill in required fields!');

        let users = JSON.parse(localStorage.getItem('app_users')) || [];
        
        if(!isLogin) {
            if(users.find(u => u.email === email)) return alert('Account already exists! Please login.');
            let newUser = { email: email, pass: pass, balance: 0.00, history: [] };
            users.push(newUser);
            localStorage.setItem('app_users', JSON.stringify(users));
            currentUser = newUser;
        } else {
            let found = users.find(u => u.email === email && u.pass === pass);
            if(!found) return alert('Invalid Email or Password!');
            currentUser = found;
        }

        localStorage.setItem('user_logged', email);
        showDashboard();
    }

    function showDashboard() {
        let email = localStorage.getItem('user_logged');
        let users = JSON.parse(localStorage.getItem('app_users')) || [];
        currentUser = users.find(u => u.email === email) || { email: email, balance: 0.00, history: [] };

        document.getElementById('user-bal').innerText = Number(currentUser.balance).toFixed(2);
        document.getElementById('auth-box').classList.add('d-none');
        document.getElementById('dashboard-view').classList.remove('d-none');
        document.getElementById('nav-bar').classList.remove('d-none');
        loadProducts();
    }

    function logout() {
        localStorage.removeItem('user_logged');
        location.reload();
    }

    function selectMFS(method) {
        selectedMethod = method;
        document.querySelectorAll('.mfs-card').forEach(c => c.classList.remove('selected'));
        document.getElementById(`mfs-${method.toLowerCase()}`).classList.add('selected');

        let nums = JSON.parse(localStorage.getItem('app_pay_numbers')) || { bkash: '01700000000', nagad: '01800000000', rocket: '01900000000' };
        document.getElementById('selected-mfs-number').innerText = nums[method.toLowerCase()] || '01700000000';
    }

    function updatePayBtnAmount() {
        let amt = document.getElementById('dep-amount').value || 0;
        document.getElementById('submit-pay-btn').innerHTML = `<i class="fa-solid fa-lock me-2"></i>Pay ৳${Number(amt).toFixed(2)} BDT`;
    }

    function submitDeposit() {
        const amt = Number(document.getElementById('dep-amount').value);
        const trx = document.getElementById('dep-trx').value.trim();

        if(!amt || amt < 25) return alert('Minimum deposit is ৳25!');
        if(!trx) return alert('Please enter Transaction ID!');

        let sourceText = 'Added via bKash Personal';
        if (selectedMethod === 'Nagad') sourceText = 'Added via Nagad';
        if (selectedMethod === 'Rocket') sourceText = 'Added via Rocket';

        let deps = JSON.parse(localStorage.getItem('app_pending_deposits')) || [];
        deps.push({
            user: currentUser.email,
            amount: amt,
            trx: trx,
            method: sourceText,
            time: new Date().toLocaleTimeString()
        });
        localStorage.setItem('app_pending_deposits', JSON.stringify(deps));

        alert('Deposit request submitted successfully!');
        document.getElementById('dep-amount').value = '';
        document.getElementById('dep-trx').value = '';
        updatePayBtnAmount();
        switchPage('dashboard');
    }

    function loadProducts() {
        let store = JSON.parse(localStorage.getItem('app_store_data')) || {};
        let catTabs = document.getElementById('cat-tabs');
        let container = document.getElementById('product-container');

        catTabs.innerHTML = '';
        container.innerHTML = '';

        let categories = Object.keys(store);
        if(!categories.length) {
            container.innerHTML = '<div class="text-center text-sub py-4 fw-semibold">No products published yet.</div>';
            return;
        }

        categories.forEach((cat, index) => {
            catTabs.innerHTML += `<button class="cat-btn ${index===0?'active':''}" onclick="filterCat('${cat}', this)">${cat}</button>`;
        });

        renderCatItems(categories[0]);
    }

    function filterCat(cat, btn) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderCatItems(cat);
    }

    function renderCatItems(cat) {
        let store = JSON.parse(localStorage.getItem('app_store_data')) || {};
        let container = document.getElementById('product-container');
        container.innerHTML = '';

        if(store[cat]) {
            store[cat].forEach(item => {
                let stockCount = item.mails ? item.mails.length : 0;
                container.innerHTML += `
                    <div class="card-box p-3 mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="fw-bold m-0 text-white">${item.title}</h6>
                            <span class="badge ${stockCount > 0 ? 'bg-success' : 'bg-danger'}">${stockCount > 0 ? 'IN STOCK' : 'OUT OF STOCK'}</span>
                        </div>
                        <h4 class="fw-bold text-primary mb-2">৳${Number(item.price).toFixed(2)}</h4>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="small fw-semibold text-sub"><i class="fa-solid fa-box me-1 text-warning"></i>Available: <strong class="text-white">${stockCount}</strong></span>
                            <button class="btn btn-primary fw-bold px-4" onclick="buyItem('${cat}', '${item.title}')">Buy Now</button>
                        </div>
                    </div>`;
            });
        }
    }

    function buyItem(cat, title) {
        let store = JSON.parse(localStorage.getItem('app_store_data')) || {};
        let item = store[cat].find(i => i.title === title);

        if(!item || !item.mails || !item.mails.length) return alert('Out of stock!');
        if(Number(currentUser.balance) < Number(item.price)) return alert('Insufficient balance! Please deposit.');

        currentUser.balance = Number(currentUser.balance) - Number(item.price);
        let mailData = item.mails.shift(); 
        
        if(!currentUser.history) currentUser.history = [];
        currentUser.history.push({
            title: item.title,
            price: item.price,
            data: mailData,
            time: new Date().toLocaleTimeString(),
            type: 'purchase'
        });

        localStorage.setItem('app_store_data', JSON.stringify(store));
        let users = JSON.parse(localStorage.getItem('app_users')) || [];
        let uIdx = users.findIndex(u => u.email === currentUser.email);
        if(uIdx !== -1) users[uIdx] = currentUser;
        localStorage.setItem('app_users', JSON.stringify(users));

        alert(`Purchase Successful!\nData: ${mailData}`);
        showDashboard();
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            alert('Copied to Clipboard!');
        });
    }

    function loadHistory() {
        let container = document.getElementById('my-history-list');
        container.innerHTML = '';
        if(!currentUser.history || !currentUser.history.length) {
            container.innerHTML = '<div class="text-center text-sub py-3">No statement or history available.</div>';
            return;
        }

        currentUser.history.slice().reverse().forEach(h => {
            if(h.type === 'purchase') {
                let isMultiple = Array.isArray(h.data) && h.data.length > 1;
                let copyContent = isMultiple ? h.data.join('\n') : h.data;

                container.innerHTML += `
                    <div class="bg-dark p-2 rounded mb-2 border-start border-4 border-primary">
                        <div class="d-flex justify-content-between align-items-center">
                            <strong>${h.title}</strong> 
                            <span class="text-danger">-৳${h.price}</span>
                        </div>
                        <div class="text-sub small my-1">Data: ${Array.isArray(h.data) ? h.data.join(', ') : h.data}</div>
                        <button class="btn btn-sm btn-outline-info py-0 px-2 mt-1 fw-bold" onclick="copyToClipboard('${copyContent}')">
                            <i class="fa-solid fa-copy me-1"></i>${isMultiple ? 'Copy All' : 'Copy'}
                        </button>
                    </div>`;
            } else {
                container.innerHTML += `
                    <div class="bg-dark p-2 rounded mb-2 border-start border-4 border-success">
                        <div class="d-flex justify-content-between"><strong>Deposit Credit</strong> <span class="text-success">+৳${h.amount}</span></div>
                        <div class="text-sub small">${h.source || h.method}</div>
                    </div>`;
            }
        });
    }

    // Global Live Feed Queues with 1-Hour Auto-Expiration
    let livePurchaseQueue = [];
    let liveDepositQueue = [];
    const ONE_HOUR = 60 * 60 * 1000; // 1 hour in ms

    function updateLivePurchaseFeed() {
        let store = JSON.parse(localStorage.getItem('app_store_data')) || {};
        let availableItems = [];

        Object.keys(store).forEach(cat => {
            store[cat].forEach(i => {
                if (i.mails && i.mails.length > 0) {
                    availableItems.push({ cat: cat, title: i.title, price: i.price, maxStock: i.mails.length });
                }
            });
        });

        let purContainer = document.getElementById('purchase-list');
        if (!availableItems.length) {
            purContainer.innerHTML = '<div class="text-sub small text-center">No active purchases.</div>';
            return;
        }

        let item = availableItems[Math.floor(Math.random() * availableItems.length)];
        let maxQty = Math.min(100, item.maxStock);
        let qty = Math.floor(Math.random() * maxQty) + 1;
        let totalPrice = (qty * item.price).toFixed(2);
        let rawEmail = generateUniqueGmail();
        let masked = maskEmail(rawEmail);

        // Push new purchase to top
        livePurchaseQueue.unshift({
            maskedEmail: masked,
            title: item.title,
            qty: qty,
            price: totalPrice,
            time: Date.now()
        });

        // Clean up entries older than 1 hour & keep max 5 recent cards
        let currentTime = Date.now();
        livePurchaseQueue = livePurchaseQueue.filter(p => (currentTime - p.time) < ONE_HOUR).slice(0, 5);

        let html = '';
        livePurchaseQueue.forEach(p => {
            html += `
                <div class="live-card d-flex justify-content-between align-items-center" style="border-left-color: #3b82f6;">
                    <div>
                        <div class="fw-bold text-white">${p.maskedEmail}</div>
                        <div class="text-sub">${p.title} - ${p.qty} pcs (৳${p.price})</div>
                    </div>
                    <span class="badge bg-primary">Completed</span>
                </div>`;
        });
        purContainer.innerHTML = html;
    }

    function updateLiveDepositFeed() {
        let depContainer = document.getElementById('deposit-list');
        let methods = ['Added via bKash Personal', 'Added via Nagad', 'Added via Rocket'];
        let amounts = [25, 30, 50, 60, 100, 250, 500];

        let rawEmail = generateUniqueGmail();
        let masked = maskEmail(rawEmail);
        let randomMethod = methods[Math.floor(Math.random() * methods.length)];
        let randomAmt = amounts[Math.floor(Math.random() * amounts.length)];

        // Push new deposit to top
        liveDepositQueue.unshift({
            maskedEmail: masked,
            method: randomMethod,
            amount: randomAmt,
            time: Date.now()
        });

        // Clean up entries older than 1 hour & keep max 3 recent cards
        let currentTime = Date.now();
        liveDepositQueue = liveDepositQueue.filter(d => (currentTime - d.time) < ONE_HOUR).slice(0, 3);

        let html = '';
        liveDepositQueue.forEach(d => {
            html += `
                <div class="live-card d-flex justify-content-between align-items-center">
                    <div>
                        <div class="fw-bold text-white">${d.maskedEmail}</div>
                        <div class="text-sub">${d.method} - ৳${d.amount}.00</div>
                    </div>
                    <span class="badge bg-success">Success</span>
                </div>`;
        });
        depContainer.innerHTML = html;
    }

    initDefaultStore();
    if(localStorage.getItem('user_logged')) showDashboard();

    // Initial feed rendering
    updateLivePurchaseFeed();
    updateLiveDepositFeed();

    // Independent timer intervals
    setInterval(updateLivePurchaseFeed, 20000); // New purchase every 20s
    setInterval(updateLiveDepositFeed, 35000);  // New deposit every 35s
</script>
</body>
</html>
