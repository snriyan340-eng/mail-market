<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Market Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b132b; color: #ffffff; font-family: 'Poppins', sans-serif; }
        .card-box { background-color: #1c2541; border: 1px solid #3a506b; border-radius: 12px; }
        .form-control, .form-select { background-color: #ffffff !important; color: #000000 !important; font-weight: 500; }
        label { font-size: 13px; font-weight: 500; color: #cbd5e1; }
    </style>
</head>
<body class="p-3">

<div class="container" style="max-width: 600px;">

    <!-- Password Auth Screen -->
    <div id="auth-box" class="card-box p-4 mx-auto my-5">
        <h5 class="fw-bold text-center mb-3">Admin Access Required</h5>
        <input type="password" id="admin-pass" class="form-control text-center mb-3" placeholder="Enter Admin Password">
        <button onclick="checkAdmin()" class="btn btn-primary w-100 fw-bold">Login to Panel</button>
    </div>

    <!-- Protected Admin Panel -->
    <div id="admin-panel" class="d-none">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="text-primary fw-bold m-0">Admin Control Center</h4>
            <button onclick="logoutAdmin()" class="btn btn-danger btn-sm fw-bold">Lock Panel</button>
        </div>

        <!-- 1. Add Category -->
        <div class="card-box p-3 mb-3">
            <h6 class="fw-bold mb-2">Add Category</h6>
            <div class="input-group">
                <input type="text" class="form-control" placeholder="Category Name (e.g. Gmail)">
                <button class="btn btn-primary fw-bold">Add</button>
            </div>
        </div>

        <!-- 2. Publish Item -->
        <div class="card-box p-3 mb-3">
            <h6 class="fw-bold mb-3">Publish Item / Stock</h6>
            <div class="mb-2">
                <label>Category</label>
                <select class="form-select">
                    <option>Hotmail</option>
                    <option>Gmail</option>
                    <option>Facebook</option>
                    <option>Edu Gmail</option>
                </select>
            </div>
            <div class="mb-2">
                <label>Title</label>
                <input type="text" class="form-control" placeholder="Item Title">
            </div>
            <div class="row g-2 mb-2">
                <div class="col"><label>Price (৳)</label><input type="number" class="form-control" placeholder="0.00"></div>
                <div class="col"><label>Stock Qty</label><input type="number" class="form-control" placeholder="0"></div>
            </div>
            <button class="btn btn-success w-100 fw-bold mt-2">Publish Item</button>
        </div>

        <!-- 3. Manual Balance Control -->
        <div class="card-box p-3 mb-3">
            <h6 class="fw-bold mb-3">Manual Balance Control</h6>
            <input type="text" class="form-control mb-2" placeholder="User Email">
            <div class="row g-2 mb-2">
                <div class="col"><input type="number" class="form-control" placeholder="Amount (৳)"></div>
                <div class="col">
                    <select class="form-select">
                        <option>Add Balance</option>
                        <option>Deduct Balance</option>
                    </select>
                </div>
            </div>
            <button class="btn btn-warning w-100 fw-bold text-dark">Update Balance</button>
        </div>

        <!-- 4. Pending Deposits -->
        <div class="card-box p-3">
            <h6 class="fw-bold mb-2">Pending Deposits</h6>
            <div class="d-flex justify-content-between align-items-center bg-dark p-2 rounded mb-2">
                <div>
                    <div class="small fw-bold">user@gmail.com</div>
                    <div class="text-success small">৳500 - TrxID: 9N74K2L</div>
                </div>
                <div>
                    <button class="btn btn-success btn-sm fw-bold me-1">Approve</button>
                    <button class="btn btn-danger btn-sm fw-bold">Reject</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    const ADMIN_SECRET = "HABIBI@RAJU";

    function checkAdmin() {
        if(document.getElementById('admin-pass').value === ADMIN_SECRET) {
            localStorage.setItem('admin_logged', 'true');
            showPanel();
        } else {
            alert('Wrong Password!');
        }
    }

    function showPanel() {
        document.getElementById('auth-box').classList.add('d-none');
        document.getElementById('admin-panel').classList.remove('d-none');
    }

    function logoutAdmin() {
        localStorage.removeItem('admin_logged');
        location.reload();
    }

    if(localStorage.getItem('admin_logged') === 'true') showPanel();
</script>
</body>
</html>
