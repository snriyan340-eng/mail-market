<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Mail Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #0b132b;
            --card-bg: #1c2541;
            --text-main: #ffffff;
            --text-sub: #cbd5e1;
            --border-color: #3a506b;
            --input-bg: #10172a;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            padding-bottom: 50px;
        }

        .card-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .form-control, .form-select {
            background-color: var(--input-bg) !important;
            color: #ffffff !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 10px;
            padding: 10px 14px;
        }

        .form-control::placeholder { color: #94a3b8 !important; }
    </style>
</head>
<body>

<div class="top-navbar bg-dark py-3 px-4 border-bottom border-secondary d-flex justify-content-between align-items-center">
    <h4 class="m-0 fw-bold text-danger"><i class="fa-solid fa-user-shield me-2"></i>Admin Dashboard</h4>
    <a href="index.html" class="btn btn-outline-light btn-sm fw-bold">Go to App</a>
</div>

<div class="container mt-4" style="max-width: 750px;">

    <!-- Set MFS Numbers -->
    <div class="card-box p-4 mb-4">
        <h5 class="fw-bold mb-3 text-warning"><i class="fa-solid fa-phone me-2"></i>Set Send Money Numbers</h5>
        <div class="row g-3">
            <div class="col-md-4">
                <label class="small text-sub mb-1">bKash Personal Number</label>
                <input type="text" id="num-bkash" class="form-control" placeholder="017xxxxxxxx">
            </div>
            <div class="col-md-4">
                <label class="small text-sub mb-1">Nagad Personal Number</label>
                <input type="text" id="num-nagad" class="form-control" placeholder="018xxxxxxxx">
            </div>
            <div class="col-md-4">
                <label class="small text-sub mb-1">Rocket Personal Number</label>
                <input type="text" id="num-rocket" class="form-control" placeholder="019xxxxxxxx">
            </div>
        </div>
        <button onclick="saveNumbers()" class="btn btn-warning fw-bold mt-3 px-4">Save Numbers</button>
    </div>

    <!-- Add Products / Stock -->
    <div class="card-box p-4 mb-4">
        <h5 class="fw-bold mb-3 text-primary"><i class="fa-solid fa-plus me-2"></i>Add / Manage Products</h5>
        
        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <label class="small text-sub mb-1">Category Name</label>
                <input type="text" id="prod-cat" class="form-control" placeholder="e.g. Hotmail / Gmail">
            </div>
            <div class="col-md-5">
                <label class="small text-sub mb-1">Product Title</label>
                <input type="text" id="prod-title" class="form-control" placeholder="e.g. Hotmail Fresh 2024">
            </div>
            <div class="col-md-3">
                <label class="small text-sub mb-1">Price Per Unit (৳)</label>
                <input type="number" id="prod-price" class="form-control" placeholder="2.50">
            </div>
        </div>

        <div class="mb-3">
            <label class="small text-sub mb-1">Product Mail Data (Line by Line)</label>
            <textarea id="prod-mails" class="form-control" rows="4" placeholder="email1@domain.com|password&#10;email2@domain.com|password"></textarea>
        </div>

        <button onclick="addProduct()" class="btn btn-primary fw-bold px-4">Publish / Update Stock</button>
    </div>

    <!-- Pending Deposit Requests -->
    <div class="card-box p-4 mb-4">
        <h5 class="fw-bold mb-3 text-success"><i class="fa-solid fa-clock me-2"></i>Pending Deposit Requests</h5>
        <div id="pending-dep-list" class="small"></div>
    </div>

    <!-- Manual Balance Credit -->
    <div class="card-box p-4 mb-4">
        <h5 class="fw-bold mb-3 text-info"><i class="fa-solid fa-wallet me-2"></i>Manual User Balance Credit</h5>
        <div class="row g-3">
            <div class="col-md-6">
                <label class="small text-sub mb-1">Target User Email</label>
                <input type="email" id="target-user-email" class="form-control" placeholder="user@gmail.com">
            </div>
            <div class="col-md-6">
                <label class="small text-sub mb-1">Amount to Add (৳)</label>
                <input type="number" id="target-user-amt" class="form-control" placeholder="100.00">
            </div>
        </div>
        <button onclick="manualAddBalance()" class="btn btn-info fw-bold mt-3 text-white px-4">Credit Balance</button>
    </div>

</div>

<script>
    function loadAdminData() {
        // Load Pay Numbers
        let nums = JSON.parse(localStorage.getItem('app_pay_numbers')) || { bkash: '01700000000', nagad: '01800000000', rocket: '01900000000' };
        document.getElementById('num-bkash').value = nums.bkash || '';
        document.getElementById('num-nagad').value = nums.nagad || '';
        document.getElementById('num-rocket').value = nums.rocket || '';

        // Load Pending Deposits
        loadPendingDeposits();
    }

    function saveNumbers() {
        let nums = {
            bkash: document.getElementById('num-bkash').value.trim(),
            nagad: document.getElementById('num-nagad').value.trim(),
            rocket: document.getElementById('num-rocket').value.trim()
        };
        localStorage.setItem('app_pay_numbers', JSON.stringify(nums));
        alert('MFS Numbers updated successfully!');
    }

    function addProduct() {
        let cat = document.getElementById('prod-cat').value.trim();
        let title = document.getElementById('prod-title').value.trim();
        let price = Number(document.getElementById('prod-price').value);
        let rawMails = document.getElementById('prod-mails').value.trim();

        if(!cat || !title || !price || !rawMails) return alert('Please fill in all product fields!');

        let mailList = rawMails.split('\n').map(m => m.trim()).filter(m => m.length > 0);

        let store = JSON.parse(localStorage.getItem('app_store_data')) || {};
        if(!store[cat]) store[cat] = [];

        let existing = store[cat].find(i => i.title === title);
        if(existing) {
            existing.price = price;
            existing.mails.push(...mailList);
        } else {
            store[cat].push({ title: title, price: price, mails: mailList });
        }

        localStorage.setItem('app_store_data', JSON.stringify(store));
        alert('Stock updated successfully!');
        
        document.getElementById('prod-cat').value = '';
        document.getElementById('prod-title').value = '';
        document.getElementById('prod-price').value = '';
        document.getElementById('prod-mails').value = '';
    }

    function loadPendingDeposits() {
        let deps = JSON.parse(localStorage.getItem('app_pending_deposits')) || [];
        let container = document.getElementById('pending-dep-list');
        container.innerHTML = '';

        if(!deps.length) {
            container.innerHTML = '<div class="text-sub py-2">No pending deposit requests.</div>';
            return;
        }

        deps.forEach((d, idx) => {
            container.innerHTML += `
                <div class="bg-dark p-3 rounded mb-2 d-flex justify-content-between align-items-center border-start border-4 border-warning">
                    <div>
                        <div class="fw-bold text-white">${d.user}</div>
                        <div class="text-sub">TrxID: <span class="text-warning">${d.trx}</span> | Amount: <strong class="text-success">৳${d.amount}</strong></div>
                        <div class="small text-info">${d.method || 'Added via bKash Personal'} (${d.time})</div>
                    </div>
                    <div class="d-flex gap-2">
                        <button onclick="approveDeposit(${idx})" class="btn btn-sm btn-success fw-bold">Approve</button>
                        <button onclick="rejectDeposit(${idx})" class="btn btn-sm btn-danger fw-bold">Reject</button>
                    </div>
                </div>`;
        });
    }

    function approveDeposit(index) {
        let deps = JSON.parse(localStorage.getItem('app_pending_deposits')) || [];
        let req = deps[index];
        if(!req) return;

        let users = JSON.parse(localStorage.getItem('app_users')) || [];
        let uIdx = users.findIndex(u => u.email === req.user);

        if(uIdx === -1) {
            alert('User account not found!');
            return;
        }

        // Add Balance
        users[uIdx].balance = Number(users[uIdx].balance || 0) + Number(req.amount);

        // Add to User History
        if(!users[uIdx].history) users[uIdx].history = [];
        users[uIdx].history.push({
            type: 'deposit',
            amount: req.amount,
            method: req.method || 'Added via bKash Personal',
            trx: req.trx,
            time: new Date().toLocaleTimeString()
        });

        localStorage.setItem('app_users', JSON.stringify(users));

        // Remove from pending
        deps.splice(index, 1);
        localStorage.setItem('app_pending_deposits', JSON.stringify(deps));

        alert('Deposit Approved Successfully!');
        loadPendingDeposits();
    }

    function rejectDeposit(index) {
        let deps = JSON.parse(localStorage.getItem('app_pending_deposits')) || [];
        deps.splice(index, 1);
        localStorage.setItem('app_pending_deposits', JSON.stringify(deps));
        alert('Deposit Request Rejected!');
        loadPendingDeposits();
    }

    function manualAddBalance() {
        let email = document.getElementById('target-user-email').value.trim();
        let amt = Number(document.getElementById('target-user-amt').value);

        if(!email || !amt) return alert('Enter target email and amount!');

        let users = JSON.parse(localStorage.getItem('app_users')) || [];
        let uIdx = users.findIndex(u => u.email === email);

        if(uIdx === -1) return alert('User not found!');

        users[uIdx].balance = Number(users[uIdx].balance || 0) + amt;
        
        if(!users[uIdx].history) users[uIdx].history = [];
        users[uIdx].history.push({
            type: 'deposit',
            amount: amt,
            method: 'Added via Admin',
            time: new Date().toLocaleTimeString()
        });

        localStorage.setItem('app_users', JSON.stringify(users));
        alert(`Successfully added ৳${amt} to ${email}`);

        document.getElementById('target-user-email').value = '';
        document.getElementById('target-user-amt').value = '';
    }

    loadAdminData();
</script>
</body>
</html>
